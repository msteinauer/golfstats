
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GolfLog" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1b2d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <title>GolfLog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1b2d; color: #f1f5f9; font-family: -apple-system, system-ui, sans-serif;
      height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #26395a; border-top-color: #4ade80;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div>Loading GolfLog…</div>

  <script>
    fetch("version.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const v = data.version;
        if (!v) throw new Error("no version");
        window.location.replace("golf-app-v" + v + ".html");
      })
      .catch(() => {
        window.location.replace("golf-app-v47.html");
      });
  </script>
</body>
</html>
